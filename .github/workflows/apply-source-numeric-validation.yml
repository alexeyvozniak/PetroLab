name: Apply scientific source validation

on:
  push:
    branches:
      - refactor/stable-analysis-ids-trace-elements-image-wizard
    paths:
      - tools/patch_source_numeric_validation.py
      - .github/workflows/apply-source-numeric-validation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python tools/patch_source_numeric_validation.py
      - name: Validate syntax
        run: python -m py_compile petrolab/sources.py
      - name: Commit patch and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "PetroLab Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add petrolab/sources.py
          git rm tools/patch_source_numeric_validation.py .github/workflows/apply-source-numeric-validation.yml
          git commit -m "Validate scientific values before Excel sync"
          git push
