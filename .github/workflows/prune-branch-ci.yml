name: Prune superseded branch CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "integration/**"
      - "refactor/**"
      - "audit/**"
      - "agent/**"

permissions:
  actions: write
  contents: read

concurrency:
  group: prune-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  cancel-stale-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel older runs for this branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const currentSha = context.sha;
            const currentRunId = Number(context.runId);
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
              per_page: 100,
            });
            const stale = runs.filter(run =>
              run.id !== currentRunId &&
              run.head_sha !== currentSha &&
              run.status !== 'completed'
            );
            core.info(`Found ${stale.length} superseded run(s) for ${branch}.`);
            for (const run of stale) {
              core.info(`Cancelling ${run.name} #${run.run_number} (${run.id}) at ${run.head_sha}.`);
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
              } catch (error) {
                if (error.status === 409) {
                  core.info(`Run ${run.id} already completed while pruning.`);
                  continue;
                }
                throw error;
              }
            }
