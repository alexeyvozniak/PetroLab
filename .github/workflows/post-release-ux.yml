name: Post-release UX regression

on:
  pull_request:
    paths:
      - 'petrolab/source_sheet_scope.py'
      - 'petrolab/services/source_sheet_image_service.py'
      - 'petrolab/ui/source_sheet_image_wizard.py'
      - 'petrolab/ui/intake_workflow.py'
      - 'petrolab/ui/pages/v0160_user_ux_hotfix.py'
      - 'petrolab/ui/pages/v0160_phase_queue_hotfix.py'
      - 'petrolab/ui/pages/v0160_source_sheet_intake_hotfix.py'
      - 'petrolab/ui/pages/v0160_statistics_integrity_hotfix.py'
      - 'petrolab/ui/pages/v0160_quick_image_entry_hotfix.py'
      - 'petrolab/oxide_mineral_recognition.py'
      - 'petrolab/mineral_recognition_extended.py'
      - 'petrolab/ui/pages/__init__.py'
      - 'tests_post_release_ux.py'
      - '.github/workflows/post-release-ux.yml'
  workflow_dispatch:

jobs:
  ux-regression:
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile UX hotfix
        run: >-
          python -m py_compile
          petrolab/source_sheet_scope.py
          petrolab/services/source_sheet_image_service.py
          petrolab/ui/source_sheet_image_wizard.py
          petrolab/ui/intake_workflow.py
          petrolab/ui/pages/v0160_user_ux_hotfix.py
          petrolab/ui/pages/v0160_phase_queue_hotfix.py
          petrolab/ui/pages/v0160_source_sheet_intake_hotfix.py
          petrolab/ui/pages/v0160_statistics_integrity_hotfix.py
          petrolab/ui/pages/v0160_quick_image_entry_hotfix.py
          petrolab/oxide_mineral_recognition.py
          petrolab/mineral_recognition_extended.py
          tests_post_release_ux.py
      - name: Run source-sheet and phase-repair regression
        run: python tests_post_release_ux.py
      - name: Run universal staging regression
        run: python tests_staging_import.py
      - name: Run Streamlit smoke
        run: python tests_streamlit.py
