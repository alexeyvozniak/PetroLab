name: Collaboration targeting verification

on:
  push:
    branches:
      - "main"
      - "feature/**"
  pull_request:
    branches: ["main"]

jobs:
  targeting:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify safe project destination suggestions
        shell: cmd
        run: python tests_collaboration_targeting.py
