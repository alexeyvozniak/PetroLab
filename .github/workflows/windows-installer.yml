name: Windows installer

on:
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/windows-installer.yml"
      - "requirements.txt"
      - "tests_installer_contract.py"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify installer contract
        shell: pwsh
        run: python tests_installer_contract.py

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          choco install imagemagick -y --no-progress

      - name: Build native launcher, branded icons and installer
        shell: pwsh
        run: .\installer\build_windows_package.ps1

      - name: Smoke-test the actual installed PetroLab.exe
        shell: pwsh
        run: .\installer\smoke_windows_install.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetroLab-Windows-Installer
          path: |
            dist/PetroLab-Setup-x64.exe
            dist/PetroLab-Setup-x64.sha256
            dist/PetroLab.exe
            dist/PetroLab.ico
            dist/PetroLab-Installer.ico
          if-no-files-found: error
          retention-days: 14

      - name: Wait for full Windows verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $deadline = (Get-Date).AddMinutes(18)
          while ((Get-Date) -lt $deadline) {
              $json = gh run list --workflow "Windows verification" --commit $env:GITHUB_SHA --limit 10 --json status,conclusion,databaseId
              if ($LASTEXITCODE -ne 0) { throw "Could not query Windows verification status." }
              $runs = $json | ConvertFrom-Json
              $run = $runs | Select-Object -First 1
              if ($run -and $run.status -eq "completed") {
                  if ($run.conclusion -ne "success") {
                      throw "Full Windows verification did not pass: $($run.conclusion)."
                  }
                  Write-Host "Full Windows verification passed (run $($run.databaseId))."
                  exit 0
              }
              Start-Sleep -Seconds 10
          }
          throw "Timed out waiting for full Windows verification of $env:GITHUB_SHA."

      - name: Publish rolling Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f windows-latest $env:GITHUB_SHA
          git push origin refs/tags/windows-latest --force

          gh release view windows-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest --title "PetroLab for Windows" --prerelease --target $env:GITHUB_SHA --notes "Rolling Windows installer for the current fully verified PetroLab build. The installer contains a native PetroLab launcher, branded Windows icons, startup diagnostics and preserves scientific user data across update/uninstall."
          }
          gh release upload windows-latest `
            dist\PetroLab-Setup-x64.exe `
            dist\PetroLab-Setup-x64.sha256 `
            dist\PetroLab.exe `
            dist\PetroLab.ico `
            dist\PetroLab-Installer.ico `
            --clobber
