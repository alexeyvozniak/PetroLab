name: Apply Sources refactor

on:
  push:
    branches: ["refactor/sources-import-service"]
    paths:
      - ".github/workflows/apply-sources-refactor.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic Sources page extraction
        run: python tools/refactor_sources_page.py

      - name: Validate refactored sources
        run: |
          python -m py_compile app.py petrolab/services/import_service.py petrolab/ui/pages/sources.py tests_import_service.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert 'render_sources_page()' in text
          assert 'def save_dataset(' not in text
          assert 'def safe_copy_upload(' not in text
          assert 'read_tabular_with_map' not in text
          assert 'reload_linked_source' not in text
          print(f'Sources extraction checks: OK; app.py = {len(text.splitlines())} lines')
          PY

      - name: Commit extracted page and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "PetroLab Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git rm tools/refactor_sources_page.py .github/workflows/apply-sources-refactor.yml
          git commit -m "Extract Sources and Import workflow"
          git push
