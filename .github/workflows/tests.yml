name: Windows verification

on:
  push:
    branches:
      - "main"
      - "refactor/**"
      - "feature/**"
      - "fix/**"
      - "audit/**"
      - "integration/**"
      - "agent/**"
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Validate BAT encoding and line endings
        shell: python
        run: |
          from pathlib import Path
          launchers = list(Path('.').glob('*.bat'))
          assert launchers, 'No BAT launchers found'
          for path in launchers:
              data = path.read_bytes()
              assert all(b < 128 for b in data), f'{path}: non-ASCII byte found'
              assert b'\n' not in data.replace(b'\r\n', b''), f'{path}: bare LF found'
          print('Windows launchers: encoding and CRLF OK')

      - name: Install PetroLab dependencies
        shell: cmd
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check "selenium>=4.23,<5"

      - name: Compile Python sources
        shell: cmd
        run: python -m compileall -q app.py petrolab scripts/build_georoc_mineral_validation.py tests_architecture.py tests_formulae.py tests_formula_input_validation.py tests_formula_fingerprint.py tests_mineral_classification.py tests_mineral_recognition_v1.py tests_alkaline_mineral_recognition.py tests_alkaline_mineral_reference.py tests_mineral_recognition_extended.py tests_alkaline_mixed_review.py tests_dataframe_utils.py tests_import_semantics.py tests_rock_semantics.py tests_new_features.py tests_group_styles.py tests_analysis_drafts.py tests_analytical_sessions.py tests_generations.py tests_mixed_minerals.py tests_density_clustering.py tests_collaboration.py tests_selective_exchange.py tests_measurement_registry.py tests_global_project_context.py tests_publication_manifest.py tests_project_archive_scope.py tests_ternary.py tests_ternary_overlays.py tests_science_workbench.py tests_scientific_hardening.py tests_storage_isotopes.py tests_ui_layout.py tests_ui_viewports.py tests_v011_integrity.py tests_audit_closure.py tests_project_archive.py tests_group_envelopes.py tests_manual_fields.py tests_sample_registry.py tests_source_registry.py tests_slides.py tests_update_launcher.py tests_update_checker.py tests_smoke.py tests_streamlit.py tests_core_workflows_v015.py

      - name: Enforce architecture rules
        shell: cmd
        run: python tests_architecture.py

      - name: Verify safe local updater
        shell: cmd
        run: python tests_update_launcher.py

      - name: Verify update notification remains safe offline
        shell: cmd
        run: python tests_update_checker.py

      - name: Check responsive UI structure
        shell: cmd
        run: python tests_ui_layout.py

      - name: Run storage bootstrap and repeated-isotope migration tests
        shell: cmd
        run: python tests_storage_isotopes.py

      - name: Run v0.11 scientific and data-integrity regressions
        shell: cmd
        run: python tests_v011_integrity.py

      - name: Verify audit v10 closure contract
        shell: cmd
        run: python tests_audit_closure.py

      - name: Run scientific audit hardening benchmarks
        shell: cmd
        run: python tests_scientific_hardening.py

      - name: Run portable project archive regressions
        shell: cmd
        run: python tests_project_archive.py

      - name: Run project archive child-entity scoping regressions
        shell: cmd
        run: python tests_project_archive_scope.py

      - name: Run import semantics and per-sheet contract regressions
        shell: cmd
        run: python tests_import_semantics.py

      - name: Run global library link regressions
        shell: cmd
        run: python tests_library_links.py

      - name: Run global database and project-context regressions
        shell: cmd
        run: python tests_global_project_context.py

      - name: Run publication manifest regressions
        shell: cmd
        run: python tests_publication_manifest.py

      - name: Run whole-rock semantics regressions
        shell: cmd
        run: python tests_rock_semantics.py

      - name: Run formula input validation regressions
        shell: cmd
        run: python tests_formula_input_validation.py

      - name: Run formula source fingerprint regressions
        shell: cmd
        run: python tests_formula_fingerprint.py

      - name: Run physical target and method-specific observation regressions
        shell: cmd
        run: python tests_measurement_registry.py

      - name: Run group envelope scientific regressions
        shell: cmd
        run: python tests_group_envelopes.py

      - name: Run manual field editor regressions
        shell: cmd
        run: python tests_manual_fields.py

      - name: Run universal sample registry regressions
        shell: cmd
        run: python tests_sample_registry.py

      - name: Run source registry and data-health regressions
        shell: cmd
        run: python tests_source_registry.py

      - name: Run crash-safe analysis edit draft regressions
        shell: cmd
        run: python tests_analysis_drafts.py

      - name: Run analytical session regressions
        shell: cmd
        run: python tests_analytical_sessions.py

      - name: Run Generation interpretation regressions
        shell: cmd
        run: python tests_generations.py

      - name: Run mixed-mineral review/materialization regressions
        shell: cmd
        run: python tests_mixed_minerals.py

      - name: Run Mineral Recognition v1 scientific contract
        shell: cmd
        run: python tests_mineral_recognition_v1.py

      - name: Run alkaline-carbonatite recognition extension regressions
        shell: cmd
        run: |
          python tests_alkaline_mineral_reference.py
          python tests_alkaline_mineral_recognition.py
          python tests_mineral_recognition_extended.py
          python tests_alkaline_mixed_review.py

      - name: Run density clustering regressions
        shell: cmd
        run: python tests_density_clustering.py

      - name: Run collaboration and selective exchange regressions
        shell: cmd
        run: |
          python tests_collaboration.py
          python tests_selective_exchange.py

      - name: Run interactive/publication group style consistency tests
        shell: cmd
        run: python tests_group_styles.py

      - name: Run total-Fe and derived-result integration tests
        shell: cmd
        run: python tests_new_features.py

      - name: Run mineral classification and Ti-garnet tests
        shell: cmd
        run: python tests_mineral_classification.py

      - name: Run ternary math and plotting regression tests
        shell: cmd
        run: python tests_ternary.py

      - name: Run sourced ternary overlay tests
        shell: cmd
        run: python tests_ternary_overlays.py

      - name: Run v0.15 core workflow regressions
        shell: cmd
        run: python tests_core_workflows_v015.py

      - name: Reset transient artifacts before science workbench
        shell: cmd
        run: |
          git reset --hard HEAD
          git clean -fdx

      - name: Run science workbench and whole-rock tests
        shell: cmd
        run: python tests_science_workbench.py

      - name: Run real-browser multi-viewport UI checks
        shell: cmd
        run: python tests_ui_viewports.py

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petrolab-viewport-screenshots
          path: viewport_artifacts
          if-no-files-found: warn

      - name: Run real PetroLab Windows startup in CI mode
        shell: cmd
        run: |
          set PETROLAB_CI=1
          call START_PETROLAB.bat
