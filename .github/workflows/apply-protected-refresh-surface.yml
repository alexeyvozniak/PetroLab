name: Apply protected refresh surface

on:
  push:
    branches:
      - refactor/stable-analysis-ids-trace-elements-image-wizard
    paths:
      - tools/patch_protected_refresh_surface.py
      - .github/workflows/apply-protected-refresh-surface.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python tools/patch_protected_refresh_surface.py
      - name: Validate syntax
        run: python -m py_compile petrolab/services/import_service.py petrolab/ui/pages/sources.py tests_import_service.py tests_image_service.py
      - name: Commit patch and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "PetroLab Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add petrolab/services/import_service.py petrolab/ui/pages/sources.py tests_import_service.py tests_image_service.py
          git rm tools/patch_protected_refresh_surface.py .github/workflows/apply-protected-refresh-surface.yml
          git commit -m "Protect image and history metadata during refresh"
          git push
