name: Apply unified analyses refactor

on:
  push:
    branches: ["refactor/unified-analysis-service"]
    paths:
      - ".github/workflows/apply-analyses-refactor.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic analyses page extraction
        run: python tools/refactor_analyses_page.py

      - name: Validate extracted entrypoint
        run: |
          python -m py_compile app.py petrolab/services/analysis_service.py petrolab/repositories/analysis_repository.py petrolab/ui/pages/analyses.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert 'render_analyses_page()' in text
          assert 'def project_selector' not in text
          assert 'def collect_related_images' not in text
          assert 'sync_cell_changes' not in text
          assert 'from uuid import uuid4' in text
          print(f'Unified analyses extraction: OK; app.py = {len(text.splitlines())} lines')
          PY

      - name: Commit extracted page and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "PetroLab Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git rm tools/refactor_analyses_page.py .github/workflows/apply-analyses-refactor.yml
          git commit -m "Extract unified analyses workflow"
          git push
