name: Publication composer regression

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  publication-composer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install PetroLab dependencies
        shell: cmd
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile publication composer paths
        shell: cmd
        run: python -m compileall -q petrolab/publication_composer.py petrolab/multi_panel_plotting.py petrolab/ui/pages/publication_composer.py petrolab/ui/pages/v0152_publication_wrappers.py petrolab/ui/pages/scenario_hubs.py petrolab/ui/navigation.py app.py tests_publication_composer.py

      - name: Run publication composer regressions
        shell: cmd
        run: python tests_publication_composer.py
