name: Guided analysis workflow verification

on:
  push:
    branches:
      - feature/guided-analysis-workflow
  pull_request:
    paths:
      - "petrolab/workflow_screening.py"
      - "petrolab/phase_suggestions.py"
      - "petrolab/repositories/image_repository.py"
      - "petrolab/ui/pages/guided_workflow.py"
      - "petrolab/ui/pages/mixed_minerals.py"
      - "petrolab/ui/navigation.py"
      - "petrolab/ui/pages/__init__.py"
      - "app.py"
      - "tests_guided_workflow.py"
      - ".github/workflows/guided-workflow.yml"

jobs:
  guided-workflow-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile guided workflow sources
        run: >-
          python -m py_compile
          app.py
          petrolab/workflow_screening.py
          petrolab/phase_suggestions.py
          petrolab/repositories/image_repository.py
          petrolab/ui/pages/guided_workflow.py
          petrolab/ui/pages/mixed_minerals.py
          petrolab/ui/navigation.py
      - name: Run guided workflow integrity tests
        run: python tests_guided_workflow.py
      - name: Run existing mixed-mineral regressions
        run: python tests_mixed_minerals.py
      - name: Run image-link regressions
        run: python tests_image_service.py
      - name: Run alkaline recognition integration regression
        run: python tests_alkaline_mixed_review.py
