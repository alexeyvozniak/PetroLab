name: Apply FeOt formula patch

on:
  push:
    branches:
      - refactor/stable-analysis-ids-trace-elements-image-wizard
    paths:
      - tools/patch_formula_feot.py
      - .github/workflows/apply-formula-feot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python tools/patch_formula_feot.py
      - name: Validate syntax
        run: python -m py_compile petrolab/minerals/formulae.py
      - name: Commit patch and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "PetroLab Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add petrolab/minerals/formulae.py
          git rm tools/patch_formula_feot.py .github/workflows/apply-formula-feot.yml
          git commit -m "Handle FeOt explicitly in formula calculations"
          git push
