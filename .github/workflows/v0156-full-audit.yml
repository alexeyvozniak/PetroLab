name: v0.15.5 full UI audit regression

on:
  pull_request:
  push:
    branches:
      - audit/v0155-full-silent-ui

jobs:
  full-ui-audit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PetroLab dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile audited UI paths
        run: >-
          python -m py_compile
          petrolab/ui/project_context.py
          petrolab/ui/pages/projects.py
          petrolab/ui/pages/v0156_audit_wrappers.py
          petrolab/ui/pages/__init__.py
          tests_v0156_full_audit.py
      - name: Run full-audit regressions
        run: python tests_v0156_full_audit.py
      - name: Re-run prior exact-selection regressions
        run: python tests_v0151_ui_selection.py
      - name: Re-run project-context regressions
        run: |
          python tests_global_project_context.py
          python tests_project_switch_scope.py
      - name: Re-run route-stack and UI contracts
        run: |
          python tests_v0155_route_stack.py
          python tests_ui_layout.py
