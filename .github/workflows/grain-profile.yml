name: Grain profile regression

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  grain-profile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install PetroLab dependencies
        shell: cmd
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile grain profile paths
        shell: cmd
        run: python -m compileall -q petrolab/grain_profiles.py petrolab/ui/pages/grain_profile.py petrolab/ui/pages/v0153_grain_profile_wrappers.py petrolab/ui/pages/__init__.py petrolab/ui/navigation.py app.py tests_grain_profiles.py

      - name: Run grain profile scientific regressions
        shell: cmd
        run: python tests_grain_profiles.py
