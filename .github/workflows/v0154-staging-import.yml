name: Universal staging import verification

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  staging-import-regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install PetroLab dependencies
        shell: cmd
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile staging, provenance and linked-panel paths
        shell: cmd
        run: >-
          python -m compileall -q
          petrolab/import_staging.py
          petrolab/staged_import_service.py
          petrolab/row_provenance.py
          petrolab/term_registry.py
          petrolab/textural_runtime.py
          petrolab/rock_determinations.py
          petrolab/rock_staged_service.py
          petrolab/rock_comparison.py
          petrolab/rock_work_groups.py
          petrolab/ui/intake_workflow.py
          petrolab/ui/universal_intake.py
          petrolab/ui/universal_intake_extensions.py
          petrolab/ui/staging_editor.py
          petrolab/ui/staged_intake.py
          petrolab/ui/source_controls.py
          petrolab/ui/linked_panels.py
          petrolab/ui/rock_linked_panels.py
          petrolab/ui/workflow_continuity_v0154.py
          petrolab/ui/workflow_cluster_bridge_v0154.py
          petrolab/ui/pages/add_data.py
          petrolab/ui/pages/__init__.py
          petrolab/ui/pages/multi_panel.py
          petrolab/ui/pages/v0152_publication_wrappers.py
          petrolab/ui/pages/rocks_v0154.py
          petrolab/ui/pages/rocks_staging_bridge_v0154.py
          petrolab/ui/pages/whole_rock_compare_linked_v0154.py
          petrolab/ui/pages/v0151_intake_wrappers.py
          tests_import_staging.py
          tests_row_provenance_v0154.py
          tests_term_registry_v0154.py
          tests_rock_staging_v0154.py
          tests_source_visibility_v0154.py
          tests_v0154_workflow_continuity.py
          tests_linked_multi_panel_v0154.py

      - name: Run staging and linked-panel regressions
        shell: cmd
        run: |
          python tests_import_staging.py
          python tests_row_provenance_v0154.py
          python tests_term_registry_v0154.py
          python tests_rock_staging_v0154.py
          python tests_source_visibility_v0154.py
          python tests_v0154_workflow_continuity.py
          python tests_linked_multi_panel_v0154.py

      - name: Run existing import and provenance regressions
        shell: cmd
        run: |
          python tests_import_service.py
          python tests_source_registry.py
          python tests_sample_registry.py
          python tests_v0151_runtime_import_e2e.py

      - name: Run existing whole-rock and comparison regressions
        shell: cmd
        run: |
          python tests_rock_semantics.py
          python tests_rock_workspace.py
          python tests_rock_workspace_hardening.py
          python tests_core_workflows_v015.py
