name: Apply UI page refactor

on:
  push:
    branches: ["refactor/ui-pages-home-projects"]
    paths:
      - ".github/workflows/apply-ui-page-refactor.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic page extraction
        run: python tools/refactor_home_projects_pages.py

      - name: Validate refactored UI sources
        run: |
          python -m py_compile app.py petrolab/ui/pages/home.py petrolab/ui/pages/projects.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert 'render_home_page()' in text
          assert 'render_projects_page()' in text
          assert 'with st.form("new_project"' not in text
          assert 'st.subheader("Новая графическая логика")' not in text
          print('Home/Projects extraction checks: OK')
          PY

      - name: Commit extracted pages and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "PetroLab Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git rm tools/refactor_home_projects_pages.py .github/workflows/apply-ui-page-refactor.yml
          git commit -m "Extract Home and Projects pages"
          git push
