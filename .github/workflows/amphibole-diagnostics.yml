name: Amphibole diagnostics verification

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  amphibole-screening:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install PetroLab dependencies
        shell: cmd
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile amphibole and classification paths
        shell: cmd
        run: python -m compileall -q petrolab/minerals/amphibole_ima.py petrolab/amphibole_runtime.py tests_amphibole_ima.py tests_mineral_classification.py

      - name: Run amphibole and classification regressions
        shell: cmd
        run: |
          python tests_amphibole_ima.py
          python tests_mineral_classification.py
