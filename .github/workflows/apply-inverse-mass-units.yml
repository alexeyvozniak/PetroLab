name: Apply inverse-mass unit aliases

on:
  push:
    branches:
      - refactor/stable-analysis-ids-trace-elements-image-wizard
    paths:
      - tools/patch_inverse_mass_units.py
      - .github/workflows/apply-inverse-mass-units.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python tools/patch_inverse_mass_units.py
      - name: Validate syntax
        run: python -m py_compile petrolab/column_schema.py tests_column_schema.py
      - name: Commit patch and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "PetroLab Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add petrolab/column_schema.py tests_column_schema.py
          git rm tools/patch_inverse_mass_units.py .github/workflows/apply-inverse-mass-units.yml
          git commit -m "Recognize inverse-mass trace element units"
          git push
