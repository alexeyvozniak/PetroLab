name: User-derived fields regression

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  formula-builder:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install PetroLab dependencies
        shell: cmd
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Formula Builder sources
        shell: cmd
        run: python -m compileall -q petrolab/user_derived.py petrolab/user_derived_runtime.py petrolab/ui/pages/formulae.py tests_user_derived.py

      - name: Run Formula Builder scientific and safety regression
        shell: cmd
        run: python tests_user_derived.py
