name: Assemble verified staged sources

on:
  push:
    branches: ["main"]
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source files
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          root = Path('.bootstrap')
          specs = {
              'app.py': ('app.py.gz.b64.part', 'a72fe778ea8eaf000384cf0956850c4d2e6cecd786dda7f5093978a353619544'),
              'petrolab/db.py': ('petrolab__db.py.gz.b64.part', '4c106d79a1e73f175205eabf43840418709548d619f791fac2b63ec03a6577d5'),
              'petrolab/minerals/formulae.py': ('petrolab__minerals__formulae.py.gz.b64.part', '006e6070163c411f7ff58e6ae9a3ab704d3a7371bf8e87e760df97c7615b7ca1'),
          }
          for target, (prefix, expected) in specs.items():
              parts = sorted(root.glob(prefix + '*'))
              assert parts, f'No staged chunks for {target}'
              encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
              data = gzip.decompress(base64.b64decode(encoded))
              actual = hashlib.sha256(data).hexdigest()
              assert actual == expected, f'{target}: SHA-256 mismatch: {actual}'
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(f'{target}: {len(data)} bytes, SHA-256 OK')

      - name: Compile reconstructed sources
        run: python -m compileall -q app.py petrolab tests_formulae.py tests_smoke.py tests_streamlit.py

      - name: Commit verified sources
        shell: bash
        run: |
          git config user.name "PetroLab CI"
          git config user.email "actions@users.noreply.github.com"
          git add app.py petrolab/db.py petrolab/minerals/formulae.py
          git rm -r .bootstrap
          git commit -m "Assemble verified PetroLab v0.4.2 sources"
          git push
