name: Apply XLSM VBA preservation

on:
  push:
    branches:
      - refactor/stable-analysis-ids-trace-elements-image-wizard
    paths:
      - tools/patch_xlsm_vba_preservation.py
      - .github/workflows/apply-xlsm-vba-preservation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python tools/patch_xlsm_vba_preservation.py
      - name: Validate syntax
        run: python -m py_compile petrolab/sources.py
      - name: Commit patch and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "PetroLab Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add petrolab/sources.py
          git rm tools/patch_xlsm_vba_preservation.py .github/workflows/apply-xlsm-vba-preservation.yml
          git commit -m "Preserve VBA when syncing XLSM workbooks"
          git push
